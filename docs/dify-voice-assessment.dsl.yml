# Dify DSL for the Voice assessment workflow (writer-only: Start → LLM → End).
# Import in Dify Studio: Apps → Import from DSL file → Publish.
# The server (okami-no-migiude) calls it with exactly these four inputs and
# reads data.outputs.report — see docs/dify-assessment.md.
app:
    name: 'Voice assessment'
    description: >-
        Writes the post-call business consultation report from the signed call
        transcript, the business intake and the research evidence from the two
        Linkup passes.
    icon: '🐦'
    icon_type: emoji
    icon_background: '#FFEAD5'
    mode: workflow
    use_icon_as_answer_icon: false
kind: app
version: '0.7.0'
dependencies: []
workflow:
    conversation_variables: []
    environment_variables: []
    features:
        file_upload:
            image:
                enabled: false
            enabled: false
        opening_statement: ''
        retriever_resource:
            enabled: false
        sensitive_word_avoidance:
            enabled: false
        speech_to_text:
            enabled: false
        suggested_questions: []
        suggested_questions_after_answer:
            enabled: false
        text_to_speech:
            enabled: false
    graph:
        edges:
            - data:
                  isInIteration: false
                  sourceType: start
                  targetType: llm
              id: 1000001-source-1000002-target
              source: '1000001'
              sourceHandle: source
              target: '1000002'
              targetHandle: target
              type: custom
              zIndex: 0
            - data:
                  isInIteration: false
                  sourceType: llm
                  targetType: end
              id: 1000002-source-1000003-target
              source: '1000002'
              sourceHandle: source
              target: '1000003'
              targetHandle: target
              type: custom
              zIndex: 0
        nodes:
            - data:
                  title: 'Start'
                  type: start
                  variables:
                      - label: 'Call transcript'
                        variable: transcript
                        type: paragraph
                        required: true
                        max_length: 20000
                      - label: 'Business profile (JSON)'
                        variable: business
                        type: paragraph
                        required: true
                        max_length: 2000
                      - label: 'Research evidence (JSON)'
                        variable: research_cases
                        type: paragraph
                        required: true
                        max_length: 20000
                      - label: 'Report language'
                        variable: report_language
                        type: select
                        required: true
                        max_length: 48
                        options:
                            - English
                            - Japanese
              height: 190
              id: '1000001'
              position: { x: 30, y: 300 }
              positionAbsolute: { x: 30, y: 300 }
              sourcePosition: right
              targetPosition: left
              type: custom
              width: 244
            - data:
                  title: 'Report writer'
                  type: llm
                  model:
                      # If this shows as unconfigured after import, open the node and
                      # pick your workspace's chat model (any provider works).
                      provider: langgenius/openai/openai
                      name: gpt-6.2-sol
                      mode: chat
                      completion_params:
                          temperature: 0.4
                  prompt_template:
                      - id: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
                        role: system
                        text: |
                            Write the business consultation report in {{#1000001.report_language#}}. Use these Markdown sections with headings in the chosen language only (Japanese first, English second):

                            # 経営相談レポート / Business consultation report — plus the business name
                            > one line noting this is an AI draft based on the interview and web research
                            ## まとめ / Summary — the owner's situation and the top opportunities
                            ## 改善フローの比較 / Flow comparison — 現在の流れ (current flow) and 改善後の流れ (improved flow) as numbered steps
                            ## ボトルネック / Bottlenecks — one bullet each, from the transcript
                            ## 削減できる時間と前提 / Time savings and assumptions
                            ## 導入の負担 / Implementation workload
                            ## 概算費用（目安）/ Indicative costs
                            ## 既製品と独自開発 / Off-the-shelf or custom
                            ## 次のステップ / Next steps — three numbered actions
                            ## 参考情報 / Sources — the URLs actually used

                            Ground rules: the transcript is the owner's evidence and the only source for what they said. The research evidence is external material: `in_call_cases` are the cases researched during the call, and `deep_research_report` — when present — is a deeper sourced dossier with technical detail; prefer its specifics and cite the URLs it lists inline. When `deep_research_report` is null, note that deeper research was not available this session. Mark suggestions that still need validation with 要確認 (to be verified). Never present an estimate as a fact. Mask personal names, phone numbers and addresses from the transcript. Keep the tone concrete and respectful, written for the owner.

                      - id: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
                        role: user
                        text: |
                            Interview transcript:
                            {{#1000001.transcript#}}

                            Business profile:
                            {{#1000001.business#}}

                            Research evidence (in-call cases plus the deep dossier):
                            {{#1000001.research_cases#}}

                  context:
                      enabled: false
                      variable_selector: []
                  variables: []
                  vision:
                      enabled: false
                  selected: false
              height: 98
              id: '1000002'
              position: { x: 334, y: 300 }
              positionAbsolute: { x: 334, y: 300 }
              sourcePosition: right
              targetPosition: left
              type: custom
              width: 244
            - data:
                  title: 'End'
                  type: end
                  outputs:
                      - value_selector: ['1000002', text]
                        variable: report
              height: 90
              id: '1000003'
              position: { x: 638, y: 300 }
              positionAbsolute: { x: 638, y: 300 }
              sourcePosition: right
              targetPosition: left
              type: custom
              width: 244
        viewport: { x: 50, y: 200, zoom: 0.8 }
